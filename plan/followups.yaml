items:
    - title: weasyprint missing locally for PDF conv.
      id: BfN6
      date: "2026-07-28"
      tags:
        - plan/phase:cli-help-option
        - type:ambiguity
        - priority:unspecified
        - effort:unspecified
      text: 'Flagged by a task agent implementing the md2x --help option (worktree 2026-07-28-cli-help-option). While smoke-testing, HTML conversion worked end-to-end but a PDF conversion attempt failed with "''weasyprint'' not found" — pandoc''s PDF engine on this dev machine. AGENTS.md''s build/test prerequisites list only pandoc, gs (Ghostscript), and pdftk; weasyprint isn''t mentioned. Unrelated to the --help change itself (confirmed pre-existing, not a regression). Worth a maintainer check: is weasyprint a real hidden prerequisite that should be documented (and checked in the CLI''s binary preflight), or is this specific to this machine''s pandoc/PATH configuration?'
    - title: Undocumented jq dependency in md2x.sh
      id: baU7
      date: "2026-07-29"
      tags:
        - type:bug
        - priority:unspecified
        - effort:unspecified
      text: 'Flagged by the planning agent for plan `test-coverage-bugfix`. `src/cli/md2x.sh` (around the VERSION= line) runs `VERSION=$(OUTPUT=$(git status --porcelain) && [ -z "${OUTPUT}" ] && cat package.json | jq ''.version'' || echo ''working'')` on every invocation, not just under `--infer-version` — it shells out to `git` and `jq` and reads `package.json` from the CWD unconditionally. `jq` is not named in the binary preflight check (`gs`/`pandoc`/`pdftk` only), nor in AGENTS.md''s, README.md''s, or docs/md2x-spec.md''s prerequisite lists. When `jq` is missing, the command degrades silently to the literal string ''working'' rather than failing loudly. Worth a maintainer decision: add `jq` to the documented prerequisites and preflight check, or replace it with something that doesn''t add a hidden dependency.'
    - title: Unreachable default-title branch in md2x.js
      id: udVi
      date: "2026-07-29"
      tags:
        - type:bug
        - priority:unspecified
        - effort:unspecified
      text: 'Flagged by the planning agent for plan `test-coverage-bugfix`. In `src/node/md2x.js`, the condition `if (!title && sourceSpec === ''-'')` can never be true: `sourceSpec` is always constructed pre-quoted (the literal string `''-''` with surrounding quote characters), never the bare string `-`, so the identity comparison against `''-''` never matches and the intended `title = ''Report''` default is dead code. Worth a maintainer fix: compare against the quoted form, or normalize before comparing.'
    - title: markdown-string staging produces undefined.md
      id: egcc
      date: "2026-07-29"
      tags:
        - type:bug
        - priority:unspecified
        - effort:unspecified
      text: Flagged by the planning agent for plan `test-coverage-bugfix`. In `src/node/md2x.js`, when `md2x()` is called with a `markdown` string and no `title`, the staging file is built as `` `${title}.md` `` before any default is applied, producing a literal `undefined.md` file and, downstream, an `undefined.<format>` output file. Related to the unreachable-default-title followup (`udVi`) in the same file — fixing that branch's reachability may also need this staging-path construction reordered to apply the title default first. Worth a maintainer fix.
    - title: Unquoted path expansion breaks on spaces
      id: 95ND
      date: "2026-07-29"
      tags:
        - type:bug
        - priority:unspecified
        - effort:unspecified
      text: 'Flagged by the planning agent for plan `test-coverage-bugfix`. In `src/cli/md2x.sh`, `for ROOT_DIR in $SEARCH_DIRS` and the unquoted `find ${ROOT_DIR} -name "*.md"` word-split on whitespace, so any input directory path containing a space breaks silently (splits into multiple bogus paths rather than erroring). Pre-existing, not touched by the `test-coverage-bugfix` plan (explicitly out of scope there — that plan''s tests must not assert space-containing paths work, only that the change doesn''t make this worse). Worth a maintainer fix: quote `${ROOT_DIR}` and iterate `SEARCH_DIRS` via a null-safe or newline-safe mechanism instead of unquoted word-splitting.'
    - title: PDF output currently ships with NO GitHub-mar
      id: TNLq
      date: "2026-07-29"
      tags:
        - type:ambiguity
        - plan/phase:weasyprint-pdf-engine
        - priority:unspecified
        - effort:unspecified
      text: PDF output currently ships with NO GitHub-markdown CSS styling — WeasyPrint rejects the --css process-substitution file outright (no .css extension to sniff MIME type), so the stylesheet never loads for PDF output (HTML/DOCX unaffected). Fixed only the stdout-purity symptom (filtered the resulting stderr message); did not restructure CSS delivery — a real temp .css file does make WeasyPrint load styles but then emits ~10 non-fatal multi-line WARNING lines per conversion with no reliable machine-parseable boundary for stdout-purity filtering. Recommend a small dedicated follow-up task to restore PDF styling and decide how to handle WeasyPrint's CSS-compatibility warnings, ideally with a visual check of rendered output. Not caught by any of the 8 written Validation checks.
