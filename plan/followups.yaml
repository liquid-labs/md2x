    - title: md2x.js sources:[] edge case behavior change
      id: GuQR
      date: "2026-07-30"
      tags:
        - type:bug
        - plan/phase:resolve-followups
        - priority:medium
        - effort:unspecified
      text: 'Phase-01 (resolve-followups) phase-review correctness lens found: in src/node/md2x.js, the pre-diff sourceSpec construction (`sources ? \`''${sources.join("'' ''")}''\` : ''''`) took the truthy branch for `sources: []` and produced a literal empty-quoted shell argument (`''''`), which the CLI received as one empty positional argument. Task 003''s shellQuote refactor (`sources ? sources.map(shellQuote).join('' '') : ''''`) instead produces a genuinely empty string for `sources: []`, so no source argument is emitted at all — a materially different CLI code path (zero positional args vs one empty one). Neither the pre- nor post-diff test suite exercises this exact edge case, so it wasn''t caught by coverage. Worth a maintainer decision: pick the intended behavior for `sources: []` deliberately (preserve the old empty-arg behavior, or keep the new no-arg behavior) and add a Jest case covering it.'
    - title: WeasyPrint lock failure misdiagnosis
      id: zwH4
      date: "2026-07-30"
      tags:
        - type:bug
        - plan/phase:resolve-followups
        - priority:low
        - effort:unspecified
      text: 'Phase-01 (resolve-followups) phase-review correctness lens found (low confidence): in src/cli/lib/ensure-weasyprint.sh''s cold-bootstrap lock loop (lines ~85-95), every `mkdir "${WEASYPRINT_LOCK_DIR}"` failure is treated identically as "another process holds the lock" and polled for up to the full 180s timeout before reporting a stale-lock message. If mkdir instead fails for an unrelated, persistent reason (e.g. unwritable $HOME), the process still busy-waits the full 180s and then reports a misleading diagnosis pointing at the wrong remediation (rm -rf ~/.md2x-venv.lock, which wouldn''t fix a permissions issue). Worth a maintainer fix: distinguish EEXIST-style contention (confirm via `[[ -d "${WEASYPRINT_LOCK_DIR}" ]]` after a failed mkdir) from other mkdir failure modes, and fail fast with an accurate message on the latter.'
    - title: generate-page() shadows COMBINED_FILE
      id: roct
      date: "2026-07-30"
      tags:
        - type:bug
        - priority:medium
        - effort:unspecified
      text: 'Discovered during toc-generation planning (2026-07-30). src/cli/lib/generate-page.sh (~line 152) reassigns the caller''s global COMBINED_FILE variable for its own PDF-overlay merge target, reusing the same name md2x.sh''s --single-page path uses for the concatenated-input file. Harmless today because the two uses don''t currently overlap in a way that causes observable breakage, but it''s a live shadowing hazard: a future change to either the --single-page flow or generate-page()''s overlay merge could silently clobber the other''s value. Worth renaming one of the two variables to remove the collision.'
    - title: Task doc's 'Mode overrides' bullet ('--mode o
      id: ntBH
      date: "2026-07-30"
      tags:
        - type:ambiguity
        - plan/phase:markdown-toc-generation
        - priority:low
        - effort:unspecified
      text: 'Task doc''s ''Mode overrides'' bullet (''--mode on emits a TOC for a one-heading, one-line document'') is in tension with the toc-defaults note''s unconditional document-title-exclusion rule: a genuine one-heading document can never produce a non-empty TOC under any mode, since its sole heading is always the excluded title. Resolved by testing the real intent (mode overriding the size-based auto-suppress heuristic) against the smallest document with a non-title heading; documented in the bats test''s inline comment and the task doc''s Status/Decisions entry. Flagging in case the task doc bullet wording should be tightened for future readers -- implemented behavior is spec-correct, no code defect.'
    - title: toc-preprocess slug collision probe O(d²)
      id: psgq
      date: "2026-07-30"
      tags:
        - plan/phase:phase-01-markdown-toc-generation
        - type:optimization
        - priority:low
        - effort:unspecified
      text: Surfaced by the phase-1 boundary review's efficiency lens (low confidence, not blocking). allocate_slug() in src/cli/lib/toc-preprocess.py restarts its collision probe from n=1 on every call for a given base slug, so a document with many headings that flatten to the same slug text (e.g. many identically-worded or empty-text headings) makes each successive duplicate probe linearly through all prior duplicates before finding a free base-N -- O(d^2) in the number of duplicates d for that base, rather than O(d). This mirrors Pandoc's own documented collision-probing behavior (plan/notes/pandoc-gfm-slug-algorithm.md), so it's likely intentional parity rather than an accidental regression, and real documents rarely carry enough same-text headings for this to matter. If this ever needs to scale to documents with large numbers of duplicate heading texts, track a per-base "next probe index" in a dict alongside `used` so each call starts its probe where the previous duplicate for that base left off, preserving O(1) amortized per call instead of O(d) per call.
