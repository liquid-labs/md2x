    - title: md2x.js sources:[] edge case behavior change
      id: GuQR
      date: "2026-07-30"
      tags:
        - type:bug
        - plan/phase:resolve-followups
        - priority:unspecified
        - effort:unspecified
      text: 'Phase-01 (resolve-followups) phase-review correctness lens found: in src/node/md2x.js, the pre-diff sourceSpec construction (`sources ? \`''${sources.join("'' ''")}''\` : ''''`) took the truthy branch for `sources: []` and produced a literal empty-quoted shell argument (`''''`), which the CLI received as one empty positional argument. Task 003''s shellQuote refactor (`sources ? sources.map(shellQuote).join('' '') : ''''`) instead produces a genuinely empty string for `sources: []`, so no source argument is emitted at all — a materially different CLI code path (zero positional args vs one empty one). Neither the pre- nor post-diff test suite exercises this exact edge case, so it wasn''t caught by coverage. Worth a maintainer decision: pick the intended behavior for `sources: []` deliberately (preserve the old empty-arg behavior, or keep the new no-arg behavior) and add a Jest case covering it.'
    - title: WeasyPrint lock failure misdiagnosis
      id: zwH4
      date: "2026-07-30"
      tags:
        - type:bug
        - plan/phase:resolve-followups
        - priority:unspecified
        - effort:unspecified
      text: 'Phase-01 (resolve-followups) phase-review correctness lens found (low confidence): in src/cli/lib/ensure-weasyprint.sh''s cold-bootstrap lock loop (lines ~85-95), every `mkdir "${WEASYPRINT_LOCK_DIR}"` failure is treated identically as "another process holds the lock" and polled for up to the full 180s timeout before reporting a stale-lock message. If mkdir instead fails for an unrelated, persistent reason (e.g. unwritable $HOME), the process still busy-waits the full 180s and then reports a misleading diagnosis pointing at the wrong remediation (rm -rf ~/.md2x-venv.lock, which wouldn''t fix a permissions issue). Worth a maintainer fix: distinguish EEXIST-style contention (confirm via `[[ -d "${WEASYPRINT_LOCK_DIR}" ]]` after a failed mkdir) from other mkdir failure modes, and fail fast with an accurate message on the latter.'
    - title: --single-page temp file not cleaned up
      id: flSJ
      date: "2026-07-30"
      tags:
        - type:bug
        - priority:unspecified
        - effort:unspecified
      text: 'Discovered during toc-generation planning (2026-07-30). The `--single-page` concatenation target (`<title>.md` or `input.md`, built in src/cli/md2x.sh) is written into the user''s current working directory and is never removed after conversion, even when `--keep-intermediate` is NOT specified. Every other intermediate artifact (Pandoc log, PDF header/footer overlay) is cleaned up by default and only kept with --keep-intermediate; this one is not. Worth a maintainer decision: clean it up by default (respecting --keep-intermediate like the other intermediates), or document the exception if it''s intentional.'
