    - title: markdown-body flags unquoted word-split risk
      id: 5gem
      date: "2026-07-30"
      tags:
        - plan/phase:restore-pdf-styling
        - type:bug
        - priority:unspecified
        - effort:unspecified
      text: 'Phase-01 (restore-pdf-styling) task 004 incremental review found: in src/cli/lib/generate-page.sh, the new --include-before-body/--include-after-body flag+value pairs are injected via an unquoted command substitution ($( ... echo "--include-before-body ${BODY_OPEN_TMP_FILE} --include-after-body ${BODY_CLOSE_TMP_FILE}" )) that relies on IFS word-splitting to separate the two flag/value pairs into four distinct pandoc arguments. If ${TMPDIR} (or the /tmp fallback) contains a space, the mktemp-produced paths embedded in this string would split into extra, misaligned tokens on the pandoc command line, silently corrupting the invocation rather than failing loudly. Differs from the existing --pdf-engine=${WEASYPRINT_BIN} idiom, which fuses flag and value into a single ''=''-joined token immune to this failure mode. Low real-world likelihood (TMPDIR rarely contains spaces) but worth a maintainer decision: restructure to pass flag+value as individually-quoted array elements, or fuse with ''='' if pandoc''s flag parsing accepts that form for these two options.'
    - title: Two more temp files added to errexit leak
      id: MwYH
      date: "2026-07-30"
      tags:
        - plan/phase:restore-pdf-styling
        - type:optimization
        - priority:unspecified
        - effort:unspecified
      text: 'Phase-01 (restore-pdf-styling) task 004 incremental review found: BODY_OPEN_TMP_FILE/BODY_CLOSE_TMP_FILE are created unconditionally on every generate-page() call, mirroring CSS_TMP_FILE. Because md2x.sh runs with errexit and generate-page() can be invoked once per file inside a multi-file conversion loop, a mid-invocation pandoc failure skips the cleanup lines the same way it already skips CSS_TMP_FILE cleanup (tracked in followup 9hZL) -- this diff adds two more per-invocation temp files to that same leak surface, tripling (from one file to three) the stray temp files left behind per failed conversion in a batch run. Not blocking -- reproduces an existing, task-doc-mandated pattern rather than introducing a new one. If addressed, do so together with the pre-existing CSS_TMP_FILE leak (followup 9hZL), e.g. via a single trap-based cleanup, rather than as a separate fix.'
