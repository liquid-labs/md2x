version: 2
items:
    - title: Hardcoded /policy/ path in --flatten-dirs
      id: aI57
      date: "2026-07-28"
      tags:
        - type:bug
        - priority:unspecified
        - effort:unspecified
      text: In src/cli/md2x.sh, the non-`--flatten-dirs` (mirror-directory-structure) code path derives the output subdirectory via `REL_DIR=$(dirname "${MD_FILE#*/policy/}")`. This hardcodes a `/policy/` substring strip that looks like a leftover from a different project's directory convention rather than general-purpose behavior — it will not generalize correctly for input paths that don't contain a `/policy/` segment (the strip silently no-ops and the full path gets used as REL_DIR instead of a path relative to some sensible root). Found while authoring README.md; the README documents the flag's evident intended contract ("mirror the input directory structure") rather than this implementation detail, since the intended behavior is what should be fixed toward. Worth a maintainer review/fix.
    - title: package.json bin references missing file
      id: IxJH
      date: "2026-07-28"
      tags:
        - type:bug
        - priority:unspecified
        - effort:unspecified
      text: 'package.json declares a second bin entrypoint, "liq-gen-roles-ref": "bin/liq-gen-roles-ref.sh", but no such file exists anywhere in the repo (only bin/md2x is present). Found while authoring docs/project-structure.md during this session''s doc-authoring round. Looks like leftover/incorrect package.json content — either the file was never added, was removed without updating package.json, or the entry belongs to a different package. Worth a maintainer review: either restore/add the script or remove the stale bin entry.'
    - title: weasyprint missing locally for PDF conv.
      id: BfN6
      date: "2026-07-28"
      tags:
        - plan/phase:cli-help-option
        - type:ambiguity
        - priority:unspecified
        - effort:unspecified
      text: 'Flagged by a task agent implementing the md2x --help option (worktree 2026-07-28-cli-help-option). While smoke-testing, HTML conversion worked end-to-end but a PDF conversion attempt failed with "''weasyprint'' not found" — pandoc''s PDF engine on this dev machine. AGENTS.md''s build/test prerequisites list only pandoc, gs (Ghostscript), and pdftk; weasyprint isn''t mentioned. Unrelated to the --help change itself (confirmed pre-existing, not a regression). Worth a maintainer check: is weasyprint a real hidden prerequisite that should be documented (and checked in the CLI''s binary preflight), or is this specific to this machine''s pandoc/PATH configuration?'
    - title: Undocumented jq dependency in md2x.sh
      id: baU7
      date: "2026-07-29"
      tags:
        - type:bug
        - priority:unspecified
        - effort:unspecified
      text: 'Flagged by the planning agent for plan `test-coverage-bugfix`. `src/cli/md2x.sh` (around the VERSION= line) runs `VERSION=$(OUTPUT=$(git status --porcelain) && [ -z "${OUTPUT}" ] && cat package.json | jq ''.version'' || echo ''working'')` on every invocation, not just under `--infer-version` — it shells out to `git` and `jq` and reads `package.json` from the CWD unconditionally. `jq` is not named in the binary preflight check (`gs`/`pandoc`/`pdftk` only), nor in AGENTS.md''s, README.md''s, or docs/md2x-spec.md''s prerequisite lists. When `jq` is missing, the command degrades silently to the literal string ''working'' rather than failing loudly. Worth a maintainer decision: add `jq` to the documented prerequisites and preflight check, or replace it with something that doesn''t add a hidden dependency.'
    - title: Unreachable default-title branch in md2x.js
      id: udVi
      date: "2026-07-29"
      tags:
        - type:bug
        - priority:unspecified
        - effort:unspecified
      text: 'Flagged by the planning agent for plan `test-coverage-bugfix`. In `src/node/md2x.js`, the condition `if (!title && sourceSpec === ''-'')` can never be true: `sourceSpec` is always constructed pre-quoted (the literal string `''-''` with surrounding quote characters), never the bare string `-`, so the identity comparison against `''-''` never matches and the intended `title = ''Report''` default is dead code. Worth a maintainer fix: compare against the quoted form, or normalize before comparing.'
