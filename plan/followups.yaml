version: 2
items:
    - title: Additional output formats (epub/odt/latex)
      id: icGJ
      date: "2026-10-04"
      tags:
        - type:enhancement
        - priority:unspecified
        - effort:unspecified
      text: md2x supports only pdf, html, and docx (OUTPUT_FORMATS in src/cli/lib/parameters.sh, which carries a commented-out 'opendocument'). Pandoc could also produce EPUB, ODT, RTF, LaTeX/.tex, plain text, and slides. Each new format would need a decision on CSS/header-footer applicability, TOC behavior, and the intermediate format chosen in src/cli/md2x.sh, plus docs and tests. Deliberately excluded from the 1.0 hardening scope, where docs and help were limited to pdf/html/docx.
    - title: Custom CSS and styling options
      id: shhS
      date: "2026-10-04"
      tags:
        - type:enhancement
        - priority:unspecified
        - effort:unspecified
      text: Styling is fixed to the bundled src/cli/lib/github.css, with no per-invocation configuration (docs/md2x-spec.md, 'Consistent styling'). Users of Markdown converters commonly expect a --css option, a no-style mode, paper size, margins, orientation, a syntax-highlighting style, and author/date/language metadata. Any of these would extend the CLI flag table, the Node option set, and the spec's non-goals section. Excluded from the 1.0 hardening scope.
    - title: Config file / MD2X_* env namespace
      id: gs2k
      date: "2026-10-04"
      tags:
        - type:enhancement
        - priority:unspecified
        - effort:unspecified
      text: md2x has no configuration surface beyond flags. No .md2xrc, no --config, and no MD2X_* environment variables exist. HOME (for ~/.md2x/venv and ~/.md2x-venv.lock in src/cli/lib/ensure-weasyprint.sh) and TMPDIR are the only environment inputs, and there is no override for the WeasyPrint venv location. Users converting many files in one repo must repeat flags. Decide whether to reserve the .md2xrc / MD2X_* namespaces, then design precedence (flags over env over config file). Excluded from the 1.0 hardening scope.
    - title: Self-contained HTML output option
      id: kgpR
      date: "2026-10-04"
      tags:
        - type:enhancement
        - priority:unspecified
        - effort:unspecified
      text: HTML output from src/cli/lib/generate-page.sh is not self-contained. The 1.0 hardening inlines only the bundled CSS; relative images stay external, resolved relative to the output file. An opt-in mode (for example a flag mapped to pandoc --embed-resources, pandoc 2.19 or newer) would inline images and other local assets as data URIs, so a single .html file can be moved or emailed. This needs a decision on the pandoc version floor and on remote-resource fetching, which is SSRF-relevant per the WeasyPrint caveat in docs/md2x-spec.md. Excluded from the 1.0 hardening scope.
    - title: 'Deferred: --jobs/progress, header/footer/font'
      id: 1wy6
      date: "2026-10-04"
      tags:
        - type:enhancement
        - priority:low
        - effort:unspecified
      text: 'From 1.0 audit (audit-interface.md N4 and feature parts of N8), deferred by user decision during golden-release-hardening planning: (a) --jobs parallelism and progress output; (b) configurable header/footer, first-page header, font. Title safety for non-ASCII/PostScript-special characters is NOT deferred; it is in the plan.'
    - title: Drop bash-toolkit lists, harden heredoc
      id: 32b8
      date: "2026-10-05"
      tags:
        - type:optimization
        - priority:low
        - effort:unspecified
        - plan/phase:interface-contract
        - plan/slug:golden-release-hardening
      text: 'Maintainability items in src/cli/md2x.sh (now ~690 lines): (1) ''import lists'' from @liquid-labs/bash-toolkit (line ~38) is used only for three list-add-item calls (lines ~272, 276, 325); replace with plain string appends and drop the devDependency and lock entries. (2) The Lua filter is embedded through a ''<<EOF'' heredoc filled by bash-rollup (line ~605); a bare EOF line in md2x-links.lua would silently truncate it, so use a unique terminator such as MD2X_LUA_EOF or add a bats guard that the extracted filter equals the source file. (3) Discovery/resolution could move to lib/input-discovery.sh. (4) Efficiency suggestions: md2x-percent-encode (src/cli/lib/link-filter.sh) forks per byte; md2x-lookup-record plan scan is O(n^2); md2xAsync output buffers in src/node/md2x.js are uncapped (sync path caps at 64MiB).'
    - title: Validate pandoc floor and RELEASING artifacts
      id: S0YR
      date: "2026-10-05"
      tags:
        - type:documentation
        - priority:low
        - effort:unspecified
        - plan/phase:interface-contract
        - plan/slug:golden-release-hardening
      text: 'Two items for the CI and release documentation tasks: (1) the pandoc >= 2.0 floor in src/cli/lib/preflight.sh is derived from changelogs only and only pandoc 3.10.1 has been exercised; add a CI job on an older pandoc to validate the claimed floor or raise the floor to the oldest tested release. (2) RELEASING.md line 7 still lists the published artifacts as bin/md2x and dist/md2x.js; the build now produces dist/md2x.mjs, dist/md2x.cjs and dist/index.d.ts (package.json files is bin/* and dist/*). Confirm the release-procedure task covers the artifact list.'
    - title: Infer-version hardening trade-offs and spoof
      id: HdEH
      date: "2026-10-05"
      tags:
        - type:documentation
        - priority:low
        - effort:unspecified
        - plan/phase:remediation-03
        - plan/slug:golden-release-hardening
      text: 'Minor items from the round 3 security review of src/cli/lib/preflight.sh and docs/md2x-spec.md. (1) Dropping global/system git config (GIT_CONFIG_GLOBAL=/dev/null, GIT_CONFIG_NOSYSTEM=1) changes what status reports: a global core.excludesFile, core.autocrlf/core.eol (CRLF checkouts), or LFS filters in global/system config can produce a false ''working'' version, and a global safe.directory is dropped so repos owned by another uid (CI containers) fail rev-parse with the misleading warning ''not inside a git work tree''. Add one sentence to the spec''s --infer-version note describing these trade-offs and optionally improve the safe.directory warning text. (2) An existing but empty config.worktree with extensions.worktreeConfig=true is refused as ''could not be read''; treat an empty file as zero keys (check -s first). Common local keys (core.autocrlf, core.untrackedcache, lfs.*, submodule.active) refuse the whole repo by design; the spec already says so. (3) A hostile repo with core.worktree=/abs/other/repo redirects the resolved top level so the footer can print another repository''s package.json version (no code execution; spoofed version only); optionally refuse when the git dir resolved from the input differs from the one resolved from the top level, or pass -c core.worktree= (untested). (4) Optionally read keys with ''git config -z --list --name-only'' to remove any dependence on newline-free key names (no bypass found).'
    - title: Release dry-run and doc wording polish
      id: FUld
      date: "2026-10-05"
      tags:
        - type:bug
        - priority:low
        - effort:unspecified
        - plan/phase:docs-ci-and-release-readiness
        - plan/slug:golden-release-hardening
      text: 'Minor items from the Phase 3 review. (1) scripts/release.sh dry-run: it reverts the version bump (revert_bump) before ''bun publish --dry-run --access public --tag "$DIST_TAG"'', so the rehearsal packs the pre-bump version while the tag is computed for the new version (for example a prerelease version paired with --tag latest for 1.0.0), and prepack rebuilds bin/md2x at the old version; run the publish dry-run before revert_bump (then revert) or document that the rehearsal runs at the pre-bump version; RELEASING.md says the dry run proves ''the same file list and the given tag''. (2) SECURITY.md ''Expected response'' promises an acknowledgement ''within a few days'' (unconfirmed by the maintainer) and the advisory URL only works if private vulnerability reporting is enabled on the GitHub repository; soften to best-effort with no guaranteed timeline and confirm the setting before release. (3) CHANGELOG.md Added states the CI workflow ''runs the suite under macOS, Linux, bash 3.2, and a legacy Pandoc'' as fact; rephrase as intended until it has run. (4) .github/workflows/ci.yml has no timeout-minutes or concurrency group (a hung brew/apt step runs up to 6 hours), and the legacy-pandoc job uses dpkg -i without apt-get -f install; add them when the first CI run is observed. (5) The Node README claims about python3-venv on Debian-family systems and the apt/brew install lines were not executed on a Linux host; verify on the first CI run.'
    - title: Architecture doc small inaccuracies
      id: 5E3C
      date: "2026-10-06"
      tags:
        - type:documentation
        - priority:low
        - effort:unspecified
        - plan/phase:doc-updates
        - plan/slug:golden-release-hardening
      text: 'Small inaccuracies in docs/architecture.md found by the Phase 4 review (high confidence, low severity): (1) lines ~97 and ~196 say a ''stubbed CLI suite'' runs against pandoc 2.0.6; the legacy-pandoc CI job runs plain ''make test-cli'', which includes real-toolchain bats files (links-and-images.bats runs the Lua filter against real pandoc), so drop ''stubbed''. (2) Line ~87 (and the comment at src/cli/md2x.sh:16-17) says the interpreter guard rejects POSIX mode because process substitution is unavailable, but the CLI no longer uses process substitution; reword to POSIX mode being unsupported/untested. (3) Lines ~101 and ~194 say git runs only after the config key-name check; in fact ''git rev-parse --show-toplevel'' and ''git config --local --list --name-only'' run first (through the hardened md2x-infer-git) and only ''git status'' is gated by the allowlist. (4) Line ~101 says any failure is one warning and the footer omits the version, but a failing ''git status'' sets STATUS=''?'' and prints ''working'' with no warning. (5) Line ~70 says every failure is one ''md2x: '' line; md2x-die-usage adds an unprefixed ''Try md2x --help'' line and WeasyPrint bootstrap failures print several lines. Nits: preflight order is gs, pandoc, pdftk, python3 (md2x.sh:167); with --to-stdout no output targets are planned (md2x.sh:435). Optionally group the 26 Key decisions bullets under a few ### subheadings.'
