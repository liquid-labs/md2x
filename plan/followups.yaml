version: 2
items:
    - title: Additional output formats (epub/odt/latex)
      id: icGJ
      date: "2026-10-04"
      tags:
        - type:enhancement
        - priority:unspecified
        - effort:unspecified
      text: md2x supports only pdf, html, and docx (OUTPUT_FORMATS in src/cli/lib/parameters.sh, which carries a commented-out 'opendocument'). Pandoc could also produce EPUB, ODT, RTF, LaTeX/.tex, plain text, and slides. Each new format would need a decision on CSS/header-footer applicability, TOC behavior, and the intermediate format chosen in src/cli/md2x.sh, plus docs and tests. Deliberately excluded from the 1.0 hardening scope, where docs and help were limited to pdf/html/docx.
    - title: Custom CSS and styling options
      id: shhS
      date: "2026-10-04"
      tags:
        - type:enhancement
        - priority:unspecified
        - effort:unspecified
      text: Styling is fixed to the bundled src/cli/lib/github.css, with no per-invocation configuration (docs/md2x-spec.md, 'Consistent styling'). Users of Markdown converters commonly expect a --css option, a no-style mode, paper size, margins, orientation, a syntax-highlighting style, and author/date/language metadata. Any of these would extend the CLI flag table, the Node option set, and the spec's non-goals section. Excluded from the 1.0 hardening scope.
    - title: Config file / MD2X_* env namespace
      id: gs2k
      date: "2026-10-04"
      tags:
        - type:enhancement
        - priority:unspecified
        - effort:unspecified
      text: md2x has no configuration surface beyond flags. No .md2xrc, no --config, and no MD2X_* environment variables exist. HOME (for ~/.md2x/venv and ~/.md2x-venv.lock in src/cli/lib/ensure-weasyprint.sh) and TMPDIR are the only environment inputs, and there is no override for the WeasyPrint venv location. Users converting many files in one repo must repeat flags. Decide whether to reserve the .md2xrc / MD2X_* namespaces, then design precedence (flags over env over config file). Excluded from the 1.0 hardening scope.
    - title: Self-contained HTML output option
      id: kgpR
      date: "2026-10-04"
      tags:
        - type:enhancement
        - priority:unspecified
        - effort:unspecified
      text: HTML output from src/cli/lib/generate-page.sh is not self-contained. The 1.0 hardening inlines only the bundled CSS; relative images stay external, resolved relative to the output file. An opt-in mode (for example a flag mapped to pandoc --embed-resources, pandoc 2.19 or newer) would inline images and other local assets as data URIs, so a single .html file can be moved or emailed. This needs a decision on the pandoc version floor and on remote-resource fetching, which is SSRF-relevant per the WeasyPrint caveat in docs/md2x-spec.md. Excluded from the 1.0 hardening scope.
    - title: 'Deferred: --jobs/progress, header/footer/font'
      id: 1wy6
      date: "2026-10-04"
      tags:
        - type:enhancement
        - priority:low
        - effort:unspecified
      text: 'From 1.0 audit (audit-interface.md N4 and feature parts of N8), deferred by user decision during golden-release-hardening planning: (a) --jobs parallelism and progress output; (b) configurable header/footer, first-page header, font. Title safety for non-ASCII/PostScript-special characters is NOT deferred; it is in the plan.'
    - title: Release dry-run and doc wording polish
      id: FUld
      date: "2026-10-05"
      tags:
        - type:bug
        - priority:low
        - effort:unspecified
        - plan/phase:docs-ci-and-release-readiness
        - plan/slug:golden-release-hardening
      text: 'Minor items from the Phase 3 review. (1) scripts/release.sh dry-run: it reverts the version bump (revert_bump) before ''bun publish --dry-run --access public --tag "$DIST_TAG"'', so the rehearsal packs the pre-bump version while the tag is computed for the new version (for example a prerelease version paired with --tag latest for 1.0.0), and prepack rebuilds bin/md2x at the old version; run the publish dry-run before revert_bump (then revert) or document that the rehearsal runs at the pre-bump version; RELEASING.md says the dry run proves ''the same file list and the given tag''. (2) SECURITY.md ''Expected response'' promises an acknowledgement ''within a few days'' (unconfirmed by the maintainer) and the advisory URL only works if private vulnerability reporting is enabled on the GitHub repository; soften to best-effort with no guaranteed timeline and confirm the setting before release. (3) CHANGELOG.md Added states the CI workflow ''runs the suite under macOS, Linux, bash 3.2, and a legacy Pandoc'' as fact; rephrase as intended until it has run. (4) .github/workflows/ci.yml has no timeout-minutes or concurrency group (a hung brew/apt step runs up to 6 hours), and the legacy-pandoc job uses dpkg -i without apt-get -f install; add them when the first CI run is observed. (5) The Node README claims about python3-venv on Debian-family systems and the apt/brew install lines were not executed on a Linux host; verify on the first CI run.'
    - title: Planning phase forks per file
      id: y217
      date: "2026-10-08"
      tags:
        - type:optimization
        - priority:low
        - effort:medium
        - plan/phase:followup-polish
        - plan/slug:release-followups-polish
      text: 'Target planning and input resolution in src/cli/md2x.sh and src/cli/lib/input-discovery.sh, output-plan.sh cost roughly 40 to 60 ms per input file (about 3 minutes for 4000 files under bash 5.3, about 6 minutes under bash 3.2), in a linear fork-per-helper pattern: md2x-canonical-path, md2x-canonical-target, md2x-lowercase (nested command substitutions), md2x-strip-markdown-ext, relative-output-dir, md2x-join-path and md2x-title-display each fork per file. The quadratic key lookup was replaced separately; the remaining cost could be cut by returning results through globals (printf -v style) instead of command substitutions. Measured with the stub tools and generated *.md files across 50 subdirectories.'
    - title: Input dedupe in input-discovery.sh is O(n^2)
      id: KPVO
      date: "2026-10-08"
      tags:
        - type:optimization
        - priority:low
        - effort:medium
        - plan/phase:followup-polish
        - plan/slug:release-followups-polish
      text: 'src/cli/lib/input-discovery.sh lines ~125-139: md2x-resolve-inputs keeps SEEN_CANONICAL as one growing newline-delimited string and does a glob substring match per file (O(n^2)), plus one fork per file for md2x-canonical-path. Moved verbatim from md2x.sh, so not a regression. Reuse md2x-plan-key-hex / md2x-record-set / md2x-record-get (move them out of output-plan.sh''s planning section or load them first) for an O(1) lookup. Related remaining linear cost: per-file helper forks in planning. Optional micro-nits: md2x-percent-encode re-slices HEX per byte (iterate by offset); md2xAsync re-encodes chunks to count bytes. (efficiency review, suggestion)'
    - title: 'CI: pandoc deb checksum, SHA-pin actions'
      id: uFUk
      date: "2026-10-09"
      tags:
        - type:security
        - priority:low
        - effort:unspecified
      text: .github/workflows/ci.yml downloads the legacy pandoc .deb over HTTPS from a pinned release URL with no checksum verification, and third-party actions are tag-pinned (@v4, @v2) rather than SHA-pinned. Both are pre-existing, CI-only, low risk. Add a sha256 check for the deb and pin actions to commit SHAs. (Surfaced by the release-followups-polish security review; split out of finding iRLu so it is not lost when that finding closes.)
