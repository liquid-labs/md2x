version: 2
items:
    - title: WeasyPrint lock failure misdiagnosis
      id: zwH4
      date: "2026-07-30"
      tags:
        - type:bug
        - plan/phase:resolve-followups
        - priority:low
        - effort:unspecified
        - resolution/branch:35c8d54
      text: 'Phase-01 (resolve-followups) phase-review correctness lens found (low confidence): in src/cli/lib/ensure-weasyprint.sh''s cold-bootstrap lock loop (lines ~85-95), every `mkdir "${WEASYPRINT_LOCK_DIR}"` failure is treated identically as "another process holds the lock" and polled for up to the full 180s timeout before reporting a stale-lock message. If mkdir instead fails for an unrelated, persistent reason (e.g. unwritable $HOME), the process still busy-waits the full 180s and then reports a misleading diagnosis pointing at the wrong remediation (rm -rf ~/.md2x-venv.lock, which wouldn''t fix a permissions issue). Worth a maintainer fix: distinguish EEXIST-style contention (confirm via `[[ -d "${WEASYPRINT_LOCK_DIR}" ]]` after a failed mkdir) from other mkdir failure modes, and fail fast with an accurate message on the latter.'
    - title: toc-preprocess slug collision probe O(d²)
      id: psgq
      date: "2026-07-30"
      tags:
        - plan/phase:phase-01-markdown-toc-generation
        - type:optimization
        - priority:low
        - effort:unspecified
        - resolution/task:phase-03-docs-ci-and-release-readiness/003-psgq-slug-probe-optimization.md
        - resolution/commit:5188d51f5a544d3fd94ab0e3bc6b796b49e04ec2
      text: Surfaced by the phase-1 boundary review's efficiency lens (low confidence, not blocking). allocate_slug() in src/cli/lib/toc-preprocess.py restarts its collision probe from n=1 on every call for a given base slug, so a document with many headings that flatten to the same slug text (e.g. many identically-worded or empty-text headings) makes each successive duplicate probe linearly through all prior duplicates before finding a free base-N -- O(d^2) in the number of duplicates d for that base, rather than O(d). This mirrors Pandoc's own documented collision-probing behavior (plan/notes/pandoc-gfm-slug-algorithm.md), so it's likely intentional parity rather than an accidental regression, and real documents rarely carry enough same-text headings for this to matter. If this ever needs to scale to documents with large numbers of duplicate heading texts, track a per-base "next probe index" in a dict alongside `used` so each call starts its probe where the previous duplicate for that base left off, preserving O(1) amortized per call instead of O(d) per call.
    - title: Additional output formats (epub/odt/latex)
      id: icGJ
      date: "2026-10-04"
      tags:
        - type:enhancement
        - priority:unspecified
        - effort:unspecified
      text: md2x supports only pdf, html, and docx (OUTPUT_FORMATS in src/cli/lib/parameters.sh, which carries a commented-out 'opendocument'). Pandoc could also produce EPUB, ODT, RTF, LaTeX/.tex, plain text, and slides. Each new format would need a decision on CSS/header-footer applicability, TOC behavior, and the intermediate format chosen in src/cli/md2x.sh, plus docs and tests. Deliberately excluded from the 1.0 hardening scope, where docs and help were limited to pdf/html/docx.
    - title: Custom CSS and styling options
      id: shhS
      date: "2026-10-04"
      tags:
        - type:enhancement
        - priority:unspecified
        - effort:unspecified
      text: Styling is fixed to the bundled src/cli/lib/github.css, with no per-invocation configuration (docs/md2x-spec.md, 'Consistent styling'). Users of Markdown converters commonly expect a --css option, a no-style mode, paper size, margins, orientation, a syntax-highlighting style, and author/date/language metadata. Any of these would extend the CLI flag table, the Node option set, and the spec's non-goals section. Excluded from the 1.0 hardening scope.
    - title: Config file / MD2X_* env namespace
      id: gs2k
      date: "2026-10-04"
      tags:
        - type:enhancement
        - priority:unspecified
        - effort:unspecified
      text: md2x has no configuration surface beyond flags. No .md2xrc, no --config, and no MD2X_* environment variables exist. HOME (for ~/.md2x/venv and ~/.md2x-venv.lock in src/cli/lib/ensure-weasyprint.sh) and TMPDIR are the only environment inputs, and there is no override for the WeasyPrint venv location. Users converting many files in one repo must repeat flags. Decide whether to reserve the .md2xrc / MD2X_* namespaces, then design precedence (flags over env over config file). Excluded from the 1.0 hardening scope.
    - title: Self-contained HTML output option
      id: kgpR
      date: "2026-10-04"
      tags:
        - type:enhancement
        - priority:unspecified
        - effort:unspecified
      text: HTML output from src/cli/lib/generate-page.sh is not self-contained. The 1.0 hardening inlines only the bundled CSS; relative images stay external, resolved relative to the output file. An opt-in mode (for example a flag mapped to pandoc --embed-resources, pandoc 2.19 or newer) would inline images and other local assets as data URIs, so a single .html file can be moved or emailed. This needs a decision on the pandoc version floor and on remote-resource fetching, which is SSRF-relevant per the WeasyPrint caveat in docs/md2x-spec.md. Excluded from the 1.0 hardening scope.
