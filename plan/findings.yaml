      title: Bun blocked one postinstall script during 'bu
      disposition: dismissed
      reason: 'Not actionable: blocked postinstall is most likely unrs-resolver via eslint-plugin-import-x; native bindings arrive via optionalDependencies, lint/qa/frozen install pass without it, and leaving it blocked is the safe default (do not add trustedDependencies).'
