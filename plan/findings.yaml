    - title: Docs claim coverage/ dir bun test lacks
      id: dhr8
      date: "2026-10-04"
      tags:
        - type:documentation
        - priority:low
        - plan/phase:bun-migration
        - effort:unspecified
      text: Makefile test-node runs `bun test ./src/node --coverage --coverage-reporter=text --coverage-dir=coverage`, and AGENTS.md (lines ~21-22) and docs/project-structure.md say it writes a gitignored coverage/ directory. Bun's --coverage-dir applies only to the lcov reporter, so with only the text reporter no coverage/ directory is likely produced (unverified by running). Either add --coverage-reporter=lcov in the Makefile test-node recipe so coverage/ exists, or reword AGENTS.md and docs/project-structure.md to say coverage prints to the console.
    - title: Unused @stylistic devDep in package.json
      id: DyR1
      date: "2026-10-04"
      tags:
        - type:bug
        - priority:low
        - plan/phase:bun-migration
        - effort:unspecified
      text: package.json declares devDependency @stylistic/eslint-plugin ^5.10.0, but eslint.config.mjs never imports it; the @stylistic/* rules resolve to the copy bundled with neostandard 0.13 (2.11.0 in bun.lock). The declared version is not the one in use, so rule names or options valid in 5.x could silently differ. Drop the devDependency and regenerate bun.lock, or register the plugin explicitly in eslint.config.mjs so the declared version is the one that runs.
