      text: Task 003's grep check references eslint.config.js but the config was created as eslint.config.mjs; the task doc could be updated to match.
    - title: Docs claim coverage/ dir bun test lacks
      id: dhr8
      date: "2026-10-04"
      tags:
        - type:documentation
        - priority:low
        - plan/phase:bun-migration
        - effort:unspecified
      text: Makefile test-node runs `bun test ./src/node --coverage --coverage-reporter=text --coverage-dir=coverage`, and AGENTS.md (lines ~21-22) and docs/project-structure.md say it writes a gitignored coverage/ directory. Bun's --coverage-dir applies only to the lcov reporter, so with only the text reporter no coverage/ directory is likely produced (unverified by running). Either add --coverage-reporter=lcov in the Makefile test-node recipe so coverage/ exists, or reword AGENTS.md and docs/project-structure.md to say coverage prints to the console.
    - title: Unused @stylistic devDep in package.json
      id: DyR1
      date: "2026-10-04"
      tags:
        - type:bug
        - priority:low
        - plan/phase:bun-migration
        - effort:unspecified
      text: package.json declares devDependency @stylistic/eslint-plugin ^5.10.0, but eslint.config.mjs never imports it; the @stylistic/* rules resolve to the copy bundled with neostandard 0.13 (2.11.0 in bun.lock). The declared version is not the one in use, so rule names or options valid in 5.x could silently differ. Drop the devDependency and regenerate bun.lock, or register the plugin explicitly in eslint.config.mjs so the declared version is the one that runs.
    - title: bunx may fetch unpinned tools if no install
      id: 65wX
      date: "2026-10-04"
      tags:
        - type:security
        - priority:low
        - plan/phase:bun-migration
        - effort:unspecified
      text: 'The Makefile runs bash-rollup, bats and eslint through BUNX:=bunx (test-cli, lint, lint-fix targets), all devDependencies. If node_modules is absent or incomplete (fresh checkout that skipped `bun install`), bunx fetches the latest unpinned version from the registry and executes it, bypassing bun.lock (eslint could pull a major above ^9). The release path is exposed the same way: scripts/release.sh runs `bun pm version`, whose preversion hook runs `make all && make qa`. npm exec had the same fallback, so this is not a regression. Hardening options: add `bun install --frozen-lockfile` to the release.sh pre-flight, and/or use `bunx --no-install` or node_modules/.bin/<tool> so a missing install fails instead of fetching.'
closed:
    - id: Iud2
      title: Bun blocked one postinstall script during 'bu
      disposition: dismissed
      reason: 'Not actionable: blocked postinstall is most likely unrs-resolver via eslint-plugin-import-x; native bindings arrive via optionalDependencies, lint/qa/frozen install pass without it, and leaving it blocked is the safe default (do not add trustedDependencies).'
      date: "2026-10-04"
