version: 2
items:
    - title: Planning phase forks per file
      id: y217
      date: "2026-10-08"
      tags:
        - type:optimization
        - plan/phase:followup-polish
        - priority:unspecified
        - effort:unspecified
      text: 'Target planning and input resolution in src/cli/md2x.sh and src/cli/lib/input-discovery.sh, output-plan.sh cost roughly 40 to 60 ms per input file (about 3 minutes for 4000 files under bash 5.3, about 6 minutes under bash 3.2), in a linear fork-per-helper pattern: md2x-canonical-path, md2x-canonical-target, md2x-lowercase (nested command substitutions), md2x-strip-markdown-ext, relative-output-dir, md2x-join-path and md2x-title-display each fork per file. The quadratic key lookup was replaced separately; the remaining cost could be cut by returning results through globals (printf -v style) instead of command substitutions. Measured with the stub tools and generated *.md files across 50 subdirectories.'
    - title: release.sh resume skips publish rehearsal
      id: wf4S
      date: "2026-10-08"
      tags:
        - type:bug
        - priority:low
        - plan/phase:followup-polish
        - effort:unspecified
      text: 'scripts/release.sh lines ~119-133 and ~156-162: the ''bun publish --dry-run'' rehearsal now sits inside the ''if (( ! RESUME ))'' block, so a ''release.sh --dry-run'' run that takes the resume path (tag already at HEAD with matching package.json version) never rehearses the publish, yet the later publish-section message says the rehearsal already ran above. RELEASING.md describes the rehearsal as part of every dry run. Run the rehearsal on the resume path too (the tree is already bumped), or make the echo conditional on RESUME and note the skip in RELEASING.md. (correctness review, minor, high confidence)'
    - title: Input dedupe in input-discovery.sh is O(n^2)
      id: KPVO
      date: "2026-10-08"
      tags:
        - type:optimization
        - priority:low
        - plan/phase:followup-polish
        - effort:unspecified
      text: 'src/cli/lib/input-discovery.sh lines ~125-139: md2x-resolve-inputs keeps SEEN_CANONICAL as one growing newline-delimited string and does a glob substring match per file (O(n^2)), plus one fork per file for md2x-canonical-path. Moved verbatim from md2x.sh, so not a regression. Reuse md2x-plan-key-hex / md2x-record-set / md2x-record-get (move them out of output-plan.sh''s planning section or load them first) for an O(1) lookup. Related remaining linear cost: per-file helper forks in planning. Optional micro-nits: md2x-percent-encode re-slices HEX per byte (iterate by offset); md2xAsync re-encodes chunks to count bytes. (efficiency review, suggestion)'
    - title: Harden plan record vars and async child kill
      id: iRLu
      date: "2026-10-08"
      tags:
        - type:security
        - priority:low
        - plan/phase:followup-polish
        - effort:unspecified
      text: 'Two optional robustness notes from the security review (no critical/major). (1) src/cli/lib/output-plan.sh ~151-186: record tables are shell variables named <table>_<hex> and are never cleared; an exported MD2X_PLAN_INPUT_<hex> / MD2X_PLAN_TARGET_<hex> in the caller environment could pre-seed a record and cause a false collision refusal or a wrong name in a message. Requires control of the process environment; optionally unset such variables (compgen -v) before planning. (2) src/node/md2x.js ~191-211: on the 64 MiB overflow, child.kill() sends SIGTERM only, so a child ignoring it keeps running; optionally follow with SIGKILL after a grace period or destroy/pause the streams. Also noted as pre-existing: ci.yml downloads the legacy pandoc .deb without a checksum and actions are tag-pinned not SHA-pinned. (security review, suggestion)'
    - title: Re-wrap md2x-infer-scan-keys comment
      id: SJUO
      date: "2026-10-08"
      tags:
