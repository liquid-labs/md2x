version: 2
items:
    - title: Infer-version hardening trade-offs and spoof
      id: HdEH
      date: "2026-10-05"
      tags:
        - type:documentation
        - priority:low
        - plan/phase:remediation-03
        - effort:unspecified
      text: 'Minor items from the round 3 security review of src/cli/lib/preflight.sh and docs/md2x-spec.md. (1) Dropping global/system git config (GIT_CONFIG_GLOBAL=/dev/null, GIT_CONFIG_NOSYSTEM=1) changes what status reports: a global core.excludesFile, core.autocrlf/core.eol (CRLF checkouts), or LFS filters in global/system config can produce a false ''working'' version, and a global safe.directory is dropped so repos owned by another uid (CI containers) fail rev-parse with the misleading warning ''not inside a git work tree''. Add one sentence to the spec''s --infer-version note describing these trade-offs and optionally improve the safe.directory warning text. (2) An existing but empty config.worktree with extensions.worktreeConfig=true is refused as ''could not be read''; treat an empty file as zero keys (check -s first). Common local keys (core.autocrlf, core.untrackedcache, lfs.*, submodule.active) refuse the whole repo by design; the spec already says so. (3) A hostile repo with core.worktree=/abs/other/repo redirects the resolved top level so the footer can print another repository''s package.json version (no code execution; spoofed version only); optionally refuse when the git dir resolved from the input differs from the one resolved from the top level, or pass -c core.worktree= (untested). (4) Optionally read keys with ''git config -z --list --name-only'' to remove any dependence on newline-free key names (no bypass found).'
    - title: Release dry-run and doc wording polish
      id: FUld
      date: "2026-10-05"
      tags:
        - type:bug
        - priority:low
        - plan/phase:docs-ci-and-release-readiness
        - effort:unspecified
      text: 'Minor items from the Phase 3 review. (1) scripts/release.sh dry-run: it reverts the version bump (revert_bump) before ''bun publish --dry-run --access public --tag "$DIST_TAG"'', so the rehearsal packs the pre-bump version while the tag is computed for the new version (for example a prerelease version paired with --tag latest for 1.0.0), and prepack rebuilds bin/md2x at the old version; run the publish dry-run before revert_bump (then revert) or document that the rehearsal runs at the pre-bump version; RELEASING.md says the dry run proves ''the same file list and the given tag''. (2) SECURITY.md ''Expected response'' promises an acknowledgement ''within a few days'' (unconfirmed by the maintainer) and the advisory URL only works if private vulnerability reporting is enabled on the GitHub repository; soften to best-effort with no guaranteed timeline and confirm the setting before release. (3) CHANGELOG.md Added states the CI workflow ''runs the suite under macOS, Linux, bash 3.2, and a legacy Pandoc'' as fact; rephrase as intended until it has run. (4) .github/workflows/ci.yml has no timeout-minutes or concurrency group (a hung brew/apt step runs up to 6 hours), and the legacy-pandoc job uses dpkg -i without apt-get -f install; add them when the first CI run is observed. (5) The Node README claims about python3-venv on Debian-family systems and the apt/brew install lines were not executed on a Linux host; verify on the first CI run.'
