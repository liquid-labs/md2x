version: 2
items:
    - title: Directory arg starting with - read by find
      id: yV1b
      date: "2026-10-05"
      tags:
        - type:bug
        - priority:medium
        - plan/phase:interface-contract
        - effort:unspecified
      text: In src/cli/md2x.sh a search root whose name starts with '-' (for example a directory argument '-d') is passed to find unprefixed and is read as a find option instead of a path. Prefix such roots with './' (or pass them after an explicit path form) before calling find, and add a regression test.
    - title: Filter pandoc template user-select warning
      id: KhXI
      date: "2026-10-05"
      tags:
        - type:bug
        - priority:medium
        - plan/phase:interface-contract
        - effort:unspecified
      text: 'Every PDF run still prints one WeasyPrint warning, "WARNING: Ignored `user-select: none` at 49:32, unknown property", which comes from pandoc''s own default-template style block (the pre.numberSource line-number rule), not from src/cli/lib/github.css. Add a narrow stderr filter in src/cli/lib/generate-page.sh that drops exactly that line, then remove the exemption for it in the PDF no-warnings case at the end of src/cli/test/bats/real-toolchain-e2e.bats so the test asserts zero ''WARNING: Ignored'' lines.'
    - title: Dash-leading sources parsed as CLI flags
      id: Xylz
      date: "2026-10-05"
      tags:
        - type:bug
        - priority:medium
        - plan/phase:interface-contract
        - effort:unspecified
      text: 'In src/node/md2x.js a sources entry that begins with ''-'' (other than the rejected ''-'') is passed to the CLI as an argument and parsed as a flag. The CLI parser (src/cli/lib/parse-options.sh) accepts ''--'' as end of options, so the wrapper should place ''--'' before the source arguments, or prefix relative paths with ''./''. Add a Node test for a source named like ''-weird.md''. Related CLI case: a directory argument starting with ''-'' read by find (see the finding about find option parsing).'
    - title: Node bundles hardcode build-time __dirname
      id: 8xEp
      date: "2026-10-05"
      tags:
        - type:bug
        - priority:high
        - plan/phase:interface-contract
        - effort:unspecified
      text: 'CRITICAL. In src/node/md2x.js resolveBin()/moduleDir use a bare __dirname that bun build (Makefile NODE_DIST_ESM/NODE_DIST_CJS flags) inlines as a constant "var __dirname = <absolute build-time src/node path>" in both dist/md2x.mjs and dist/md2x.cjs, so the typeof __dirname === ''string'' guard always takes the first branch and the import.meta.url fallback is never reached. An installed package therefore looks for bin/md2x under the build tree, not under its own ../bin, and md2x()/md2xAsync() throw "Could not locate the md2x CLI executable" on any other machine. scripts/test-pack.sh cannot catch it on the build host because the build tree''s bin/md2x still exists, so the installed package silently runs the build tree CLI. Fix: avoid a bare __dirname identifier the bundler can inline (use import.meta.url in the ESM bundle and a CJS-only path or per-format shim/--define), and make scripts/test-pack.sh fail when the repo-local bin/ is used (for example run the consumer check with the repo bin/ moved away, and assert the resolved path is under node_modules/@liquid-labs/md2x/bin/md2x).'
    - title: -o with trailing slash fails after convert
      id: 3rV7
      date: "2026-10-05"
      tags:
        - type:bug
        - priority:medium
        - plan/phase:interface-contract
        - effort:unspecified
      text: In src/cli/md2x.sh (target planning, around the -o validation) and src/cli/lib/generate-page.sh (delivery), '-o out/ a.md' where out/ does not yet exist passes planning (md2x-check-output-location only rejects an existing directory); delivery then runs mkdir -p out and cp output.pdf out/, which fails with a runtime error (exit 1) after conversion work and leaves an empty out/ directory. The contract is that an unusable output path is a usage error (exit 2) before any conversion. Reject an OUTPUT_FILE ending in '/' with md2x-die-usage at plan time and add a bats regression case.
    - title: index.d.ts JSDoc misdescribes options
      id: YkUH
      date: "2026-10-05"
      tags:
        - type:documentation
        - priority:low
        - plan/phase:interface-contract
        - effort:unspecified
      text: The JSDoc in src/node/index.d.ts (around lines 10-17) says inferTitle and inferVersion "infer ... from the content" and singlePage "Render a single page". The CLI actually embeds the --title or filename-derived title as metadata (inferTitle), takes the version from the first input's git repository package.json (inferVersion), and concatenates all inputs into one document (singlePage). Reword these shipped type docs to match the CLI help text.
    - title: test-pack fetches unpinned typescript
      id: tT72
      date: "2026-10-05"
      tags:
        - type:security
        - priority:low
        - plan/phase:interface-contract
        - effort:unspecified
      text: scripts/test-pack.sh (TSC fallback, around lines 58-62) runs 'npx --yes -p typescript tsc' when tsc is not on PATH, fetching and executing an unpinned latest typescript at release time; the Makefile comments explicitly reject this pattern for dev tools. Use a lockfile-pinned typescript devDependency (node_modules/.bin/tsc) or a pinned version, or drop the network fallback and use the existing syntactic-check branch.
    - title: Single-page source marker is forgeable
      id: z2v9
      date: "2026-10-05"
      tags:
        - type:security
        - priority:medium
        - plan/phase:interface-contract
        - effort:unspecified
      text: 'The Lua filter src/cli/lib/md2x-links.lua recognizes the per-source marker by parsing any top-level ''<!-- md2x:source-dir=... source=... -->'' RawBlock, so a source document can contain a hand-written marker that redirects base_dir and source_name; later images and the warnings attributed to a source then resolve against an attacker-chosen directory (image existence checks and rewritten paths only, not code execution; relevant for --single-page over mixed-trust files). Make the marker unforgeable: a per-run random nonce passed with -M (generated in src/cli/md2x.sh, emitted by src/cli/lib/link-filter.sh) that the filter requires, or strip pre-existing markers from sources during concatenation. Add a regression test with a forged marker.'
    - title: Image paths may escape source tree
      id: nPPK
      date: "2026-10-05"
      tags:
        - type:security
        - priority:low
        - plan/phase:interface-contract
        - effort:unspecified
      text: 'In src/cli/lib/md2x-links.lua (image path resolution) targets are percent-decoded and lexically resolved with ''..'' allowed to climb above the source directory, then rewritten to an absolute path for pdf/docx; pandoc runs without --sandbox and WeasyPrint fetches the file, so untrusted markdown can make the converter embed arbitrary local image files, and the ''could not find image'' warning acts as a filesystem oracle. Absolute and scheme: targets were already passed through, so this extends an existing exposure. Either confine resolved paths to the source tree/cwd (warn and leave unchanged when they escape) or document in the README/spec that markdown is trusted input.'
