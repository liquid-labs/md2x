version: 2
items:
    - title: Release may use stale node_modules
      id: tnIj
      date: "2026-10-04"
      tags:
        - type:security
        - priority:low
        - plan/phase:remediation-01
        - effort:unspecified
      text: scripts/release.sh (lines ~68-70) runs `bun install --frozen-lockfile` before `bun pm version`, but bun does not re-verify the contents of an already-installed package against the lockfile integrity hash when versions match, so a stale or tampered node_modules is still used by the preversion `make all && make qa`. Defense-in-depth only; optional hardening is `rm -rf node_modules` before the frozen install in release.sh, or documenting it in RELEASING.md.
    - title: Missing node_modules error lacks bun install
      id: VtSc
      date: "2026-10-04"
      tags:
        - type:bug
        - priority:low
        - effort:small
        - plan/phase:remediation-01
      text: 'With node_modules absent, `make lint` / `make test-cli` now fail with a raw "node_modules/.bin/<tool>: No such file or directory" from make (Makefile lines ~6-11); the message does not tell the user to run `bun install`. Optionally add a guard that prints "run `bun install`" when node_modules/.bin is missing, and confirm AGENTS.md or README documents `bun install` as the setup step before make targets.'
