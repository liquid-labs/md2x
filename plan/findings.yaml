version: 2
items:
    - title: Single-page source marker is forgeable
      id: z2v9
      date: "2026-10-05"
      tags:
        - type:security
        - priority:medium
        - plan/phase:interface-contract
        - effort:unspecified
      text: 'The Lua filter src/cli/lib/md2x-links.lua recognizes the per-source marker by parsing any top-level ''<!-- md2x:source-dir=... source=... -->'' RawBlock, so a source document can contain a hand-written marker that redirects base_dir and source_name; later images and the warnings attributed to a source then resolve against an attacker-chosen directory (image existence checks and rewritten paths only, not code execution; relevant for --single-page over mixed-trust files). Make the marker unforgeable: a per-run random nonce passed with -M (generated in src/cli/md2x.sh, emitted by src/cli/lib/link-filter.sh) that the filter requires, or strip pre-existing markers from sources during concatenation. Add a regression test with a forged marker.'
    - title: Output overwrite check is advisory only
      id: m1SB
      date: "2026-10-05"
      tags:
        - type:security
        - priority:low
        - plan/phase:interface-contract
        - effort:unspecified
      text: 'The collision and input-overwrite checks planned in src/cli/md2x.sh / src/cli/lib/output-plan.sh compare canonical path strings at plan time, but generate-page.sh delivers later with ''cp -- output FINAL_OUTPUT'': (a) a symlink swapped into the target or its parent after planning (for example during a long WeasyPrint install) defeats the check because cp follows a final-component symlink; (b) a hard link to an input, or another mount path to the same inode, is not detected. Also find lists symlinked *.md files (! -type d) so a symlink in a searched tree is read. Re-check inode equality (test -ef) against each input immediately before delivery, write via a temp file in the target directory then mv (or use no-follow semantics), and consider find -type f or document that symlinked sources are followed.'
    - title: infer-version git may run repo config
      id: SmNy
      date: "2026-10-05"
      tags:
        - type:security
        - priority:low
        - plan/phase:interface-contract
        - effort:unspecified
      text: md2x-infer-version in src/cli/lib/preflight.sh runs 'git -C <input dir> rev-parse' and 'git status --porcelain' in a directory taken from the inputs; in a repository with attacker-supplied .git/config (for example an extracted archive), core.fsmonitor or similar settings make git execute commands. Run git with '-c core.fsmonitor= -c core.hooksPath=/dev/null' (and GIT_CONFIG_NOSYSTEM=1, status --no-optional-locks), or document that --infer-version assumes a trusted repository.
    - title: infer-version git status runs clean filters
      id: r4Pu
      date: "2026-10-05"
      tags:
        - type:security
        - priority:high
        - plan/phase:remediation-01
        - effort:unspecified
      text: 'MAJOR, reproduced. md2x-infer-git in src/cli/lib/preflight.sh (lines ~74-81, used at ~90 and ~100) neutralizes core.fsmonitor and core.hooksPath, but ''git status --porcelain'' in an untrusted input directory still executes repository-configured commands: with a tracked .gitattributes ''* filter=x'' and .git/config ''[filter "x"] clean = <cmd>'', running exactly the hardened command after touching a file executed the clean filter (marker file created). core.hooksPath is irrelevant to status/rev-parse. Only reachable with --infer-version, but an extracted archive is user-owned so safe.directory does not protect. Remediate for real, not just a comment: for example skip the dirty check (and the ''working'' version) when ''git config --local --list'' (which executes nothing) shows keys that can run commands (filter.*, core.fsmonitor, include/includeIf, diff.*.command/external, core.sshCommand, core.pager and similar), warning and omitting the version instead; also set GIT_CONFIG_GLOBAL=/dev/null if appropriate. Add a bats regression case with a hostile filter driver that must not create its sentinel file (verify it fails on the current code), and document that --infer-version only trusts repositories whose local config is free of command-bearing keys.'
    - title: Output delivery edge cases and find roots
      id: wgQ3
      date: "2026-10-05"
      tags:
        - type:bug
        - priority:medium
        - plan/phase:remediation-01
        - effort:unspecified
      text: 'Edge cases in the new delivery and discovery code. (1) src/cli/lib/output-plan.sh md2x-deliver-output (lines ~187-207): the directory guard ''[[ ! -d T ]] || [[ -L T ]]'' exempts symlinks to directories, so ''mv -f -- temp T'' moves the temp file INTO the linked directory, exits 0 with no output at the requested path and leaves a hidden .md2x-out.XXXXXX there (reproduced on macOS); refuse any target where [[ -d T ]] is true (it follows symlinks) and verify afterward that the target is a regular file. (2) The mktemp template starts with the unsanitized target directory, so ''-o -d/out.pdf'' makes mktemp parse a dash-leading parent as an option (delivery fails after planning); prefix relative dash-leading directories with ''./'' or otherwise protect the template. (3) The temp file has no EXIT/INT/TERM cleanup: an interrupt between mktemp and mv leaves .md2x-out.* in the output directory; register it with the existing run cleanup trap. Replacing a target also drops the pre-existing target''s mode/ownership (document the replace semantics). (4) src/cli/md2x.sh lines ~316-317: only roots starting with ''-'' get the ''./'' prefix, but find also treats a root that is exactly ''!'', ''('', '')'' or '','' as the start of the expression (''find !'' silently searches the current directory); always prefix non-absolute roots with ''./'' (and strip it from results) or handle those tokens. Add bats regression cases for each, verifying they fail on the old code.'
    - title: Always pass nonce; harden test-pack checks
      id: xDG1
      date: "2026-10-05"
      tags:
        - type:security
        - priority:low
        - plan/phase:remediation-01
        - effort:unspecified
      text: 'Two small hardening items. (1) The per-run marker nonce is passed with -M only in --single-page mode (src/cli/lib/generate-page.sh ~59-64; filter at src/cli/lib/md2x-links.lua ~207-212), so in multi-file mode a source''s own YAML front matter ''md2x-nonce: x'' plus a ''nonce=x'' marker comment would be honored; always pass a random nonce (or an unforgeable sentinel) so source metadata cannot supply it, and add a regression case. (2) scripts/test-pack.sh (~64-66, 83-89): the embedded-build-path check treats a grep error (exit 2, for example a missing bundle) as no match and passes; ROOT uses logical pwd so a symlinked checkout would not match a physical path embedded by bun; and the TypeScript step silently falls back to a grep of the .d.ts when node_modules/.bin/tsc is absent. Check file existence first, also grep ''pwd -P'', and make a missing pinned tsc a hard failure in the release target.'
