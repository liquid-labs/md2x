version: 2
items:
    - title: infer-version git status runs clean filters
      id: r4Pu
      date: "2026-10-05"
      tags:
        - type:security
        - priority:high
        - plan/phase:remediation-01
        - effort:unspecified
      text: 'MAJOR, reproduced. md2x-infer-git in src/cli/lib/preflight.sh (lines ~74-81, used at ~90 and ~100) neutralizes core.fsmonitor and core.hooksPath, but ''git status --porcelain'' in an untrusted input directory still executes repository-configured commands: with a tracked .gitattributes ''* filter=x'' and .git/config ''[filter "x"] clean = <cmd>'', running exactly the hardened command after touching a file executed the clean filter (marker file created). core.hooksPath is irrelevant to status/rev-parse. Only reachable with --infer-version, but an extracted archive is user-owned so safe.directory does not protect. Remediate for real, not just a comment: for example skip the dirty check (and the ''working'' version) when ''git config --local --list'' (which executes nothing) shows keys that can run commands (filter.*, core.fsmonitor, include/includeIf, diff.*.command/external, core.sshCommand, core.pager and similar), warning and omitting the version instead; also set GIT_CONFIG_GLOBAL=/dev/null if appropriate. Add a bats regression case with a hostile filter driver that must not create its sentinel file (verify it fails on the current code), and document that --infer-version only trusts repositories whose local config is free of command-bearing keys.'
    - title: infer-version status may recurse submodules
      id: JEAt
      date: "2026-10-05"
      tags:
        - type:security
        - plan/phase:remediation-02
        - priority:unspecified
        - effort:unspecified
      text: md2x-infer-config-refusal in src/cli/lib/preflight.sh inspects only the top-level repository's own config before md2x-infer-version runs 'git status --porcelain'. Status can descend into submodule work trees (gitlinks whose directory carries its own .git), and those submodules' own configs (filter.*.clean, core.fsmonitor in a separate git dir) are not read by the pre-check. Consider passing --ignore-submodules=all to the status call, or checking submodule configs, and verify whether this is reachable with an untrusted input repository.
    - title: Config denylist bypassed; use allowlist
      id: U0Pj
      date: "2026-10-05"
      tags:
        - type:security
        - priority:high
        - plan/phase:remediation-02
        - effort:unspecified
      text: 'MAJOR, reproduced by the full security lens. The md2x-infer-config-refusal denylist in src/cli/lib/preflight.sh (lines ~86-95, 160-175) is bypassable and ''git status --porcelain'' (line ~188) can still run commands in an attacker-supplied repository: (a) remote.<n>.uploadpack/receivepack (not in the suffix list) and ''protocol.ext.allow=always'' with remote.origin.url=''ext::sh -c ...'' are executed when a partial-clone repo (remote.<n>.promisor=true plus partialclonefilter, blob missing locally) makes status lazy-fetch during rename detection; unlisted keys on the same path include remote.<n>.vcs, remote.<n>.proxy, protocol.*, url.*.insteadOf. (b) A checked-out submodule with its own .git/config (filter.p.clean plus a .gitattributes in the submodule and a stat-dirty file) runs its clean filter when the OUTER status runs (this also covers finding JEAt). Fix: replace the denylist with an ALLOWLIST - proceed only when every local key is in a small known-benign set (core.repositoryformatversion|filemode|bare|logallrefupdates|ignorecase|precomposeunicode|symlinks, user.*, branch.*, and similar), and refuse remote.*, protocol.*, url.*, extensions.partialclone and submodule.* (and anything unknown); add defense in depth on the status call: --ignore-submodules=all, GIT_NO_LAZY_FETCH=1 (git >= 2.44), -c protocol.allow=never, --no-renames. Add regression bats cases (partial-clone remote uploadpack/ext, submodule filter) verified failing on the current code, update the spec trust text accordingly.'
    - title: Pipefail SIGPIPE fails open in config refusal
      id: Qbv2
      date: "2026-10-05"
      tags:
        - type:security
        - priority:high
        - plan/phase:remediation-02
        - effort:unspecified
      text: 'MAJOR, reproduced. md2x-infer-config-refusal (src/cli/lib/preflight.sh lines ~119-121) detects extensions.worktreeConfig with ''printf ... | grep -qixF extensions.worktreeconfig''. md2x.sh sets pipefail and grep -q exits on first match, so when the key list exceeds the pipe buffer (~64 KB) printf takes SIGPIPE, the pipeline returns 141, and the ''if'' reads that as not set; the per-worktree config (.git/config.worktree) is then never read, so an attacker can pad .git/config with ordinary keys after extensions.worktreeConfig=true and put filter.x.clean in .git/config.worktree (reproduced with a 162 KB config). Fix: avoid pipe-then-grep -q under pipefail (use a here-string or a case match inside the key loop, or read the key via ''git config --local --bool''), lowercase the whole key list once with ''LC_ALL=C tr'' instead of forking per key (bash 3.2: no ${var,,}), and add a bats test with a >64 KB local config that must still refuse. Also drop or reword the dead post-mv -L check in md2x-deliver-output (src/cli/lib/output-plan.sh ~186-221, optional).'
