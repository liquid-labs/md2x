      slug: correctness-and-regression-tests
      title: Correctness and Regression Tests
      diff_base: 12c8da404c1e43f45abba6bb09a740f997f753f5
      tasks:
        - number: 1
          slug: error-helper-and-exit-codes
          title: Error Helper and Exit Codes
          path: phase-01-correctness-and-regression-tests/001-error-helper-and-exit-codes.md
          done: true
          tier: sonnet-med
          digest: Added errors.sh with the 0/1/2/3 exit-code contract and migrated every md2x-owned exit path to it. Tool failures now exit 1 with a named-tool message, backstopped by an EXIT-trap normalization of statuses outside 0-3. The bats suite now asserts specific codes, and error-output.bats adds regression cases that fail on the pre-change binary.
          git:
            branch: plan/golden-release-hardening-01-001
            commit:
                - "8903965"
            merge: 9f6523e90b9bfac7c68bb406502b6fa06dbbb854
        - number: 2
          slug: bash-3-2-compatibility
          title: Bash 3.2 Compatibility
          path: phase-01-correctness-and-regression-tests/002-bash-3-2-compatibility.md
          done: true
          tier: sonnet-high
          digest: Fixed B4. Apostrophes in comments inside the file-discovery process substitution and the empty INCLUDE_BODY_ARGS array under nounset broke bash 3.2; both fixed. Silent exit 0 came from a 3.2 quirk where the EXIT trap sees $?=0 after a fatal nounset error; a completion sentinel fixes it on every bash. Added a POSIX-sh guard (exit 3), the MD2X_TEST_BASH harness override, and bash-compat.bats. Full suite passes under bash 5 and /bin/bash 3.2.57.
          git:
            branch: plan/golden-release-hardening-01-002
            commit:
                - 1ff59af
            merge: 3210abe5a2e1eebd63a4e2f2c13ebe5b0a108349
        - number: 3
          slug: project-owned-option-parser
          title: Project-Owned Option Parser
          path: phase-01-correctness-and-regression-tests/003-project-owned-option-parser.md
          done: true
          tier: sonnet-high
          digest: 'Replaced the toolkit setSimpleOptions parser with project-owned src/cli/lib/parse-options.sh: explicit flag table, brew-free GNU getopt probe with MD2X_GETOPT override, help without getopt, friendly md2x usage errors with exit 2. -s now means --to-stdout; -q/-l/-n/-i rejected; brew dropped from test harness. 26 new regression cases pass under bash 5 and 3.2.'
          git:
            branch: plan/golden-release-hardening-01-003
            commit:
                - "4585085"
            merge: 57b0e846b29e1025c2191c53415b377bf0ea4959
        - number: 4
          slug: per-run-work-directory
          title: Per-Run Work Directory
          path: phase-01-correctness-and-regression-tests/004-per-run-work-directory.md
          done: true
          tier: sonnet-med
          digest: Every intermediate now lives in a per-run mktemp work directory removed by the EXIT trap (kept with --keep-intermediate). Fixes B1 single-page source deletion and keeps pandoc-log.log and other intermediates out of the cwd. generate-page no longer creates or removes files. 8 new regression cases; suite passes under bash 5 and 3.2.
          git:
            branch: plan/golden-release-hardening-01-004
            commit:
                - affc656
            merge: db674932fea6eae6511b71b7581cf4d8c49b01c3
