          path: phase-02-interface-contract/001-add-version-flag-and-help-contract.md
          done: true
          tier: sonnet-med
          digest: Added a long-only --version. A placeholder is substituted from package.json by the Makefile after rollup, and the build fails if the version cannot be read. Help now carries exit-code section, homepage, --version row, abbreviation and = note, and a formats description naming only pdf, html and docx. Eight new bats cases; validation passed under bash 5 and 3.2.
          git:
            branch: plan/golden-release-hardening-02-001
            commit:
                - cc62ba9
            merge: 5785104f830bb0604914b53bcdc950e2cb36d911
        - number: 2
          slug: harden-input-discovery-and-validation
          title: Harden Input Discovery and Validation
          path: phase-02-interface-contract/002-harden-input-discovery-and-validation.md
          done: true
          tier: sonnet-med
          digest: Input discovery builds one deduplicated, case-insensitive (*.md, *.markdown) resolved list feeding both the --title gate and conversion; adds usage error for no args, error for all-empty dirs, warning for a lone empty dir, '-' mixing error, case-insensitive -F validation, UTF-8/NUL rejection, and rejects control-character file names (x2X1). 25 new bats cases; validation passed under bash 5 and 3.2.
          git:
            branch: plan/golden-release-hardening-02-002
            commit:
                - 99b3244
            merge: 784a074da7347b076f1713cfe6d3db12dd5d0f3b
        - number: 3
          slug: add-output-option-and-collision-checks
          title: Add Output Option and Collision Checks
          path: phase-02-interface-contract/003-add-output-option-and-collision-checks.md
          done: false
          tier: sonnet-high
          digest: Added -o/--output with extension-based format inference, a pure --to-stdout stream built in the work directory, -p slash normalization and non-directory rejection, and an up-front target plan with case-insensitive collision and input-overwrite checks (exit 2 before any conversion). Pandoc output is staged under a fixed work-directory name and copied to the planned target. 34 new bats cases; validation passed under bash 5 and 3.2.
