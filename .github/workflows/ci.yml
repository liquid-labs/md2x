name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    name: qa (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # The real-toolchain e2e cases skip (they do not fail) when a tool is missing, so a
      # package that cannot be installed on a platform degrades coverage rather than the job.
      - name: Install system packages (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc ghostscript pdftk-java jq python3

      # python3 is preinstalled on macOS runners.
      - name: Install system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install pandoc ghostscript pdftk-java jq gnu-getopt

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tool versions
        run: |
          bash --version | head -n 1
          pandoc --version | head -n 1

      - name: make qa
        run: make qa

      # macOS's system /bin/bash is 3.2, md2x's supported floor. The harness runs the CLI
      # under the interpreter named by MD2X_TEST_BASH (see src/cli/test/helpers/common.bash).
      - name: Bats suite under macOS /bin/bash 3.2
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version | head -n 1
          make all
          MD2X_TEST_BASH=/bin/bash make test-cli

  # Validates the documented floor (MD2X_PANDOC_MIN_VERSION in src/cli/lib/preflight.sh) by
  # running the CLI suite against an old pandoc 2.x release instead of the distro/latest one.
  # The version is the oldest release known to publish a Linux .deb; if the floor is raised
  # or a release asset moves, update PANDOC_LEGACY_VERSION (and the floor) together.
  legacy-pandoc:
    name: bats (legacy pandoc, ubuntu)
    runs-on: ubuntu-latest
    env:
      PANDOC_LEGACY_VERSION: '2.0.6'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install system packages (without pandoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript pdftk-java jq python3

      - name: Install legacy pandoc
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/pandoc.deb" \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_LEGACY_VERSION}/pandoc-${PANDOC_LEGACY_VERSION}-1-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/pandoc.deb"
          pandoc --version | head -n 1
          pandoc --version | head -n 1 | grep -q "pandoc ${PANDOC_LEGACY_VERSION}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bats suite against legacy pandoc
        run: make test-cli
