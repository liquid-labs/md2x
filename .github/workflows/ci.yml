name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded pull request runs only; main push runs always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Ubuntu's apt pandoc is older than md2x's floor (24.04 ships 3.1.3), so every Ubuntu job gets pandoc from
# the official release .deb through the local composite action .github/actions/install-ubuntu-tools,
# pinned by version and checked against a hardcoded sha256. To add or bump a version: keep the tested
# versions' lowest entry >= MD2X_PANDOC_MIN_VERSION in src/cli/lib/preflight.sh, download
# pandoc-<version>-1-amd64.deb from https://github.com/jgm/pandoc/releases, run `shasum -a 256` on it,
# and paste the result next to the version below (the same pair appears in each job that uses it).
jobs:
  # make qa on both platforms; Ubuntu runs it against the floor (3.4) and a current pandoc (3.10.1),
  # macOS once against whatever Homebrew ships.
  #
  # The real-toolchain e2e cases skip (they do not fail) when a tool is missing, so a package that
  # cannot be installed on a platform degrades coverage rather than the job.
  qa:
    name: qa (${{ matrix.os }}, pandoc ${{ matrix.os == 'macos-latest' && 'brew (latest)' || matrix.pandoc }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        pandoc: ["3.4", "3.10.1"]
        include:
          - os: ubuntu-latest
            pandoc: "3.4"
            pandoc_sha256: "5813dac3384b9ab3e8fc2cb6f080d24ebff7d29bfef295242c01898225d3e2f3"
          - os: ubuntu-latest
            pandoc: "3.10.1"
            pandoc_sha256: "b419369915e0f3181be0afdb040ec8ecc6b70e72e5992652a0d83aed9e6bc109"
        exclude:
          # macOS gets the latest Homebrew pandoc once; a pinned 3.4 is not available there.
          - os: macos-latest
            pandoc: "3.4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install system packages (Ubuntu)
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-ubuntu-tools
        with:
          pandoc-version: ${{ matrix.pandoc }}
          pandoc-sha256: ${{ matrix.pandoc_sha256 }}

      # python3 is preinstalled on macOS runners.
      - name: Install system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install pandoc ghostscript pdftk-java jq gnu-getopt

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tool versions
        run: |
          bash --version | head -n 1
          pandoc --version | head -n 1

      - name: make qa
        run: make qa

      # macOS's system /bin/bash is 3.2, md2x's supported floor. The harness runs the CLI
      # under the interpreter named by MD2X_TEST_BASH (see src/cli/test/helpers/common.bash).
      - name: Bats suite under macOS /bin/bash 3.2
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version | head -n 1
          make all
          MD2X_TEST_BASH=/bin/bash make test-cli

  # The built package (not the bun-run sources) loaded and exercised under each supported Node.
  # bun is only the build tool here; scripts/node-smoke.cjs runs under the matrix Node.
  node:
    name: node ${{ matrix.node }} (built package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install system packages (Ubuntu)
        uses: ./.github/actions/install-ubuntu-tools
        with:
          pandoc-version: "3.10.1"
          pandoc-sha256: "b419369915e0f3181be0afdb040ec8ecc6b70e72e5992652a0d83aed9e6bc109"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: make all

      - name: Node smoke test of the built package
        run: |
          set -euo pipefail
          test "$(node --version | cut -d. -f1)" = "v${{ matrix.node }}"
          make test-node-dist

  # Boundary test: a pandoc just below the 3.4 floor must be refused with exit 3. Linux only; the
  # pandoc version is pinned in the install step and passed to the script.
  pandoc-too-old:
    name: pandoc 3.3 is refused (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # gs, pdftk, and python3 are installed too: md2x checks them before pandoc's version, so the
      # exit 3 under test has to be the pandoc one.
      - name: Install system packages (Ubuntu, pandoc 3.3)
        uses: ./.github/actions/install-ubuntu-tools
        with:
          pandoc-version: "3.3"
          pandoc-sha256: "7a6625d5aeb6b8666375807a3e16cc00659c48fb88299707651f60d88c31a360"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: make all

      - name: md2x refuses pandoc 3.3 (exit 3)
        run: scripts/test-pandoc-too-old.sh 3.3
