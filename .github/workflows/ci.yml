name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded pull request runs only; main push runs always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qa:
    name: qa (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # The real-toolchain e2e cases skip (they do not fail) when a tool is missing, so a
      # package that cannot be installed on a platform degrades coverage rather than the job.
      #
      # Ubuntu's apt pandoc is older than md2x's floor (24.04 ships 3.1.3), so pandoc comes from
      # the official release .deb, pinned and checked against a hardcoded sha256. To bump: set
      # PANDOC_VERSION (keep it >= MD2X_PANDOC_MIN_VERSION in src/cli/lib/preflight.sh), download
      # pandoc-<version>-1-amd64.deb from https://github.com/jgm/pandoc/releases, run
      # `shasum -a 256` on it, and paste the result into PANDOC_DEB_SHA256.
      - name: Install system packages (Ubuntu)
        if: runner.os == 'Linux'
        env:
          PANDOC_VERSION: "3.10.1"
          PANDOC_DEB_SHA256: "b419369915e0f3181be0afdb040ec8ecc6b70e72e5992652a0d83aed9e6bc109"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ghostscript pdftk-java jq python3
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/pandoc.deb" \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          echo "${PANDOC_DEB_SHA256}  ${RUNNER_TEMP}/pandoc.deb" | sha256sum -c -
          sudo apt-get install -y "${RUNNER_TEMP}/pandoc.deb"
          pandoc --version | head -n 1
          test "$(pandoc --version | head -n 1)" = "pandoc ${PANDOC_VERSION}"

      # python3 is preinstalled on macOS runners.
      - name: Install system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install pandoc ghostscript pdftk-java jq gnu-getopt

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tool versions
        run: |
          bash --version | head -n 1
          pandoc --version | head -n 1

      - name: make qa
        run: make qa

      # macOS's system /bin/bash is 3.2, md2x's supported floor. The harness runs the CLI
      # under the interpreter named by MD2X_TEST_BASH (see src/cli/test/helpers/common.bash).
      - name: Bats suite under macOS /bin/bash 3.2
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version | head -n 1
          make all
          MD2X_TEST_BASH=/bin/bash make test-cli
